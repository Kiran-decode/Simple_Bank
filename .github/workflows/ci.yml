name: Go

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

jobs:
  test:
    name: build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:12

        env:
          POSTGRES_USER: root1
          POSTGRES_PASSWORD: ananya
          POSTGRES_DB: simple_bank

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.20"

      - name: Install golang-migrate
        run: |
          curl -L https://github.com/golang-migrate/migrate/releases/download/v4.12.2/migrate.linux-amd64.tar.gz | tar xvz

          sudo mv migrate.linux-amd64 /usr/bin/migrate

          which migrate

      - name: Run migrations
        run: make migrateup

      - name: Test
        run: make test